name: @name@
version: @version@
description: @description@
author: @author@

main: fr.nocsy.mcpets.bukkit.MCPets
load: POSTWORLD
api-version: 1.21
depend:
  - MythicMobs
softdepend:
  - ModelEngine
  - BetterModel
  - Nexo
  - WorldGuard
  - LuckPerms
  - PlaceholderAPI
  - ItemsAdder

# Plugin messaging channel "mcpets:sync" is registered in code via Bukkit.getMessenger()
# (the 'channels' key is not part of the Bukkit plugin descriptor schema)

commands:
  mcpets:
    description: Command to manage your pets
    Usage: /mcpets
    permission: mcpets.use
    aliases: [pets]
  mcmounts:
    description: Command to view your mounts
    Usage: /mcmounts
    permission: mcpets.use
    aliases: [mounts]

permissions:
  mcpets.use:
    default: true
  mcpets.admin:
    default: op
  mcpets.color:
    default: op