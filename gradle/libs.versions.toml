[versions]
# Minecraft related
paper = "1.21.11-R0.1-SNAPSHOT"
adventure = "4.25.0"
velocity = "4.1.0-SNAPSHOT"

snakeyaml = "2.2"
cloud-core = "2.0.0"
cloud-platform = "2.0.0-beta.17"
bstats = "3.1.0"

jetbrains-annotations = "26.0.2-1"
gson = "2.11.0"
slf4j = "2.0.13"

placeholderapi = "2.11.7"
luckperms = "5.5"
mythic = "5.13.0"
modelengine = "R4.1.0"
worldguard = "7.0.17"

run-paper = "3.0.2"
shadow = "9.3.1"
foojay-resolver = "1.0.0"
blossom = "2.2.0"
lombok = "9.5.0"

[libraries]
paper = { group = "io.papermc.paper", name = "paper-api", version.ref = "paper" }
velocity = { group = "com.velocitypowered", name = "velocity-api", version.ref = "velocity" }

adventure-api = { group = "net.kyori", name = "adventure-api", version.ref = "adventure" }
adventure-text-serializer-gson = { group = "net.kyori", name = "adventure-text-serializer-gson", version.ref = "adventure" }
adventure-text-serializer-legacy = { group = "net.kyori", name = "adventure-text-serializer-legacy", version.ref = "adventure" }
minimessage = { group = "net.kyori", name = "adventure-text-minimessage", version.ref = "adventure" }

bstats-base = { group = "org.bstats", name = "bstats-base", version.ref = "bstats" }
bstats-velocity = { group = "org.bstats", name = "bstats-velocity", version.ref = "bstats" }

cloud-core = { group = "org.incendo", name = "cloud-core", version.ref = "cloud-core" }
cloud-paper = { group = "org.incendo", name = "cloud-paper", version.ref = "cloud-platform" }
cloud-velocity = { group = "org.incendo", name = "cloud-velocity", version.ref = "cloud-platform" }

snakeyaml = { group = "org.yaml", name = "snakeyaml", version.ref = "snakeyaml" }

placeholderapi = { group = "me.clip", name = "placeholderapi", version.ref = "placeholderapi" }
luckperms = { group = "net.luckperms", name = "api", version.ref = "luckperms" }
mythic = { group = "io.lumine", name = "Mythic-Dist", version.ref = "mythic" }
modelengine = { group = "com.ticxo.modelengine", name = "ModelEngine", version.ref = "modelengine" }
worldguard = { group = "com.sk89q.worldguard", name = "worldguard-bukkit", version.ref = "worldguard" }

jetbrains-annotations = { group = "org.jetbrains", name = "annotations", version.ref = "jetbrains-annotations" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }

# Plugin versions

shadow-gradle-plugin = { group = "com.gradleup.shadow", name = "com.gradleup.shadow.gradle.plugin", version.ref = "shadow" }
run-paper-gradle-plugin = { group = "xyz.jpenilla.run-paper", name = "xyz.jpenilla.run-paper.gradle.plugin", version.ref = "run-paper" }
run-velocity-gradle-plugin = { group = "xyz.jpenilla.run-velocity", name = "xyz.jpenilla.run-velocity.gradle.plugin", version.ref = "run-paper" }
lombok-gradle-plugin = { group = "io.freefair.lombok", name = "io.freefair.lombok.gradle.plugin", version.ref = "lombok" }

[bundles]
adventure = ["adventure-api"]
adventure-serializers = ["adventure-text-serializer-gson", "adventure-text-serializer-legacy"]
adventure-minimessage = ["minimessage"]

[plugins]
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
run-velocity = { id = "xyz.jpenilla.run-velocity", version.ref = "run-paper" }
gradleup-shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
foojay-resolver-convention = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver" }
blossom = { id = "net.kyori.blossom", version.ref = "blossom" }
lombok = { id = "io.freefair.lombok", version.ref = "lombok"}